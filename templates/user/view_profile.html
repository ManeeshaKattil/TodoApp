<html>
<head>
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .profile-card {
            border: none;
            border-radius: 15px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #0d6efd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-rounded {
            border-radius: 30px;
            padding: 8px 25px;
        }

        .back-bar {
            background: #e9ecef;
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f5ff;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg p-4 profile-card">

        <h2 class="text-center mb-4 fw-bold text-primary">My Profile</h2>

        <div class="text-center mb-4">
            <img src="{{ profile.Photo.url }}" class="profile-img">
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover align-middle">

                <tr><th>Name</th><td>{{ profile.Name }}</td></tr>
                <tr><th>Date of Birth</th><td>{{ profile.DOB }}</td></tr>
                <tr><th>Gender</th><td>{{ profile.Gender }}</td></tr>
                <tr><th>Place</th><td>{{ profile.Place }}</td></tr>
                <tr><th>Post</th><td>{{ profile.Post }}</td></tr>
                <tr><th>Pin Code</th><td>{{ profile.Pin }}</td></tr>
                <tr><th>Phone</th><td>{{ profile.Phone }}</td></tr>
                <tr><th>Email</th><td>{{ profile.Email }}</td></tr>

            </table>
        </div>

        <!-- Buttons -->
        <div class="text-center mt-4 d-flex justify-content-center gap-3">
            <a href="/edit_profile_get/" class="btn btn-primary btn-rounded">
                ✏️ Edit Profile
            </a>
        </div>

        <!-- Back Button Section -->
        <div class="back-bar text-center">
            <a href="/home_get/" class="btn btn-outline-secondary btn-rounded w-50">
                ⬅ Back to Home
            </a>
        </div>

    </div>

</div>

</body>
</html>
