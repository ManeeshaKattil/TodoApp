{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Style -->
    <link rel="stylesheet" href="../../static/css/style.css">
</head>

<body>

    <div class="card login-card p-4 text-white">

        <div class="text-center mb-4">
            <i class="bi bi-check2-circle fs-1"></i>
            <h3 class="app-title mt-2">To-Do App</h3>
            <p class="mb-0">Welcome back! Please login</p>
        </div>

        <form action="/login_post/" method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>

            {% for message in  messages %}
<div class="alert alert-warning alert-dismissible fade show" role="alert">
  {{ message }}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
                {% endfor %}
            <button type="submit" class="btn btn-primary w-100 btn-login">
                Login
            </button>
        </form>

        <p class="text-center mt-3 text-light">
            Don't have an account?
            <a href="/register_get/">Register</a>
        </p>

    </div>

</body>
</html>
