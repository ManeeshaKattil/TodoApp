{#{% extends 'user/home.html' %}#}
{#{% block body %}#}
<html>
<head>
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h2 class="text-center mb-4">Edit Profile</h2>

        <form method="post" action="/edit_profile_post/" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-3">
                <label>Name</label>
                <input type="text"
                       name="name"
                       value="{{ profile.Name }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Date of Birth</label>
                <input type="date"
                       name="dob"
                       value="{{ profile.DOB|date:'Y-m-d' }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Gender</label>
                <select name="gender" class="form-control">

                    <option value="Male"
                    {% if profile.Gender == 'Male' %}selected{% endif %}>
                    Male
                    </option>

                    <option value="Female"
                    {% if profile.Gender == 'Female' %}selected{% endif %}>
                    Female
                    </option>

                    <option value="Other"
                    {% if profile.Gender == 'Other' %}selected{% endif %}>
                    Other
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label>Photo</label>
                <input type="file"
                       name="photo"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Place</label>
                <input type="text"
                       name="place"
                       value="{{ profile.Place }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Post</label>
                <input type="text"
                       name="post"
                       value="{{ profile.Post }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Pin Code</label>
                <input type="number"
                       name="pin"
                       value="{{ profile.Pin }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Phone</label>
                <input type="number"
                       name="phone"
                       value="{{ profile.Phone }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email"
                       name="email"
                       value="{{ profile.Email }}"
                       class="form-control">
            </div>

            <button type="submit" class="btn btn-success">
                Update Profile
            </button>

            <a href="/view_profile/"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
{#{% endblock %}#}
