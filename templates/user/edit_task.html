{% extends 'user/home.html' %}
{% block body %}
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="-sha384MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Edit Task</title>
    </head>
    <body>
    <div class="container"><div class="card shadow-lg">
        <div class="card-header bg-dark">
                <h4 class="mb-0 text-white">Edit Task</h4>
        </div>
        <div class="card-body">
            <form action="/edit_task_post/" method="post" enctype="multipart/form-data">{% csrf_token %}
                <div class="mb-3"><label for="Title" class="form-label" >Title</label><input type="text" class="form-control" name="title" value="{{ task.Title }}" required></div>
                <div class="mb-3"><label for="Description" class="form-label">Description</label><textarea class="form-control" name="description" required>{{ task.Description }}</textarea></div>
                <div class="mb-3"><label for="Priority" class="form-label" >Priority</label>
                    <select class="form-control" name="priority" required>
                        <option value="High" {% if task.Priority == 'High' %}selected{% endif %}>High</option>
                        <option value="Medium" {% if task.Priority == 'Medium' %}selected{% endif %}>Medium</option>
                        <option value="Low" {% if task.Priority == 'Low' %}selected{% endif %}>Low</option>
                    </select>
                </div>
                <div class="mb-3"><label for="DueDate" class="form-label" >Due Date</label><input type="date" class="form-control" name="due_date" value="{{ task.Due_date|date:'Y-m-d' }}" required></div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-control" name="status">
                        <option value="Pending" {% if task.Status == 'Pending' %}selected{% endif %}>Pending</option>
                        <option value="Completed" {% if task.Status == 'Completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
                <div class="d-grid"><button type="submit" class="btn btn-secondary">Add</button></div>
            </form>
        </div>
    </div></div>
    </body>
</html>
{% endblock %}
