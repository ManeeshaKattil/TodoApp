{% extends 'user/home.html' %}
{% block body %}
<html>
    <head>
{#        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">#}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="-sha384MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Add Task</title> 
    </head>
    <body>
    <div class="container"><div class="card shadow-lg">
        <div class="card-header bg-dark">
                <h4 class="mb-0 text-white">Add Task</h4>
        </div>
        <div class="card-body">
            <form action="/add_task_post/" method="post">{% csrf_token %}
                <div class="mb-3"><label for="Title" class="form-label text-dark" >Title</label><input type="text" class="form-control" name="title" required></div>
                <div class="mb-3"><label for="Description" class="form-label text-dark">Description</label><textarea class="form-control" name="description" required></textarea></div>
                <div class="mb-3"><label for="Priority" class="form-label text-dark" >Priority</label>
                    <select class="form-control text-dark" name="priority" required>
                        <option>High</option>
                        <option>Medium</option>
                        <option>Low</option>
                    </select>
                </div>
                <div class="mb-3"><label for="DueDate" class="form-label text-dark" >Due Date</label><input type="date" class="form-control" name="due_date" required></div>
                <div class="d-grid"><button type="submit" class="btn btn-secondary">Add</button></div>
{#                {% for message in  messages %}#}
{#<div class="alert alert-warning alert-dismissible fade show" role="alert">#}
{#  {{ message }}#}
{#  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>#}
{#</div>#}
{#                {% endfor %}#}
            </form>
        </div>
    </div></div>
    </body>
</html>
{% endblock %}
